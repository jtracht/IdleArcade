name: CI/CD Release Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Headless Tests
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            apt-get update && apt-get install -y --no-install-recommends python3
          fi

      - name: Provision Android Keystore Fallback
        run: |
          mkdir -p keystores
          if [ ! -f keystores/release.keystore ]; then
            keytool -genkeypair -v -keystore keystores/release.keystore -storepass android -alias genericreleasekey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=IdleArcade, OU=Development, O=IdleArcade, L=Berlin, ST=Berlin, C=DE" || true
          fi

      - name: Import Godot Project Cache
        run: |
          TARGET_DIR="."
          if [ -d "IdleArcade" ]; then
            TARGET_DIR="IdleArcade"
          fi
          godot --headless --path "$TARGET_DIR" --editor --quit || true

      - name: Run Python CI/CD & E2E Verification
        run: |
          TARGET_DIR="."
          if [ -d "IdleArcade" ]; then
            TARGET_DIR="IdleArcade"
          fi
          python3 $TARGET_DIR/tests/test_ci_release_adversarial.py
          python3 $TARGET_DIR/tests/e2e_suite.py --tier 1
          python3 $TARGET_DIR/tests/test_phase5_mobile.py
          python3 $TARGET_DIR/tests/test_ci_export_verify.py
          python3 $TARGET_DIR/tests/test_phase6_visuals.py
          python3 $TARGET_DIR/tests/test_phase7_redesign.py
          python3 $TARGET_DIR/tests/test_phase8_verify.py
          python3 $TARGET_DIR/tests/test_phase9_verify.py
          python3 $TARGET_DIR/tests/test_phase10_verify.py
          python3 $TARGET_DIR/tests/test_phase11_verify.py

      - name: Run Godot Headless Phase 5 Mobile Tests
        run: |
          TARGET_DIR="."
          if [ -d "IdleArcade" ]; then
            TARGET_DIR="IdleArcade"
          fi
          godot --headless --path "$TARGET_DIR" -s tests/test_phase5_mobile.gd

      - name: Run Godot Headless Phase 6 Visuals & Incubator Tests
        run: |
          TARGET_DIR="."
          if [ -d "IdleArcade" ]; then
            TARGET_DIR="IdleArcade"
          fi
          godot --headless --path "$TARGET_DIR" -s tests/test_phase6_visuals.gd

      - name: Run Godot Headless Phase 7 Redesign & UX Tests
        run: |
          TARGET_DIR="."
          if [ -d "IdleArcade" ]; then
            TARGET_DIR="IdleArcade"
          fi
          godot --headless --path "$TARGET_DIR" -s tests/test_phase7_ux_models.gd

      - name: Run Godot Headless Phase 8 Tech-Tree Tests
        run: |
          TARGET_DIR="."
          if [ -d "IdleArcade" ]; then
            TARGET_DIR="IdleArcade"
          fi
          godot --headless --path "$TARGET_DIR" -s tests/test_phase8_tech_tree.gd

      - name: Run Godot Headless Phase 9 Audio & Stations Tests
        run: |
          TARGET_DIR="."
          if [ -d "IdleArcade" ]; then
            TARGET_DIR="IdleArcade"
          fi
          godot --headless --path "$TARGET_DIR" -s tests/test_phase9_audio_stations.gd

      - name: Run Godot Headless Phase 10 VFX & Lighting Tests
        run: |
          TARGET_DIR="."
          if [ -d "IdleArcade" ]; then
            TARGET_DIR="IdleArcade"
          fi
          godot --headless --path "$TARGET_DIR" -s tests/test_phase10_vfx_lighting.gd

      - name: Run Godot Headless Phase 11 Story & Minigames Tests
        run: |
          TARGET_DIR="."
          if [ -d "IdleArcade" ]; then
            TARGET_DIR="IdleArcade"
          fi
          godot --headless --path "$TARGET_DIR" -s tests/test_phase11_story_minigames.gd

  export-web:
    name: Export Web
    needs: [test]
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Relocate Godot Export Templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          if [ "$HOME" != "/root" ]; then
            cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/ || true
          fi

      - name: Build Web Export
        run: |
          mkdir -v -p build/web
          godot --headless --export-release "Web" build/web/index.html

      - name: Create Web Distribution ZIP
        run: |
          cd build/web && zip -r ../../web-build.zip .

      - name: Upload Web Directory Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/

      - name: Upload Web ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-zip
          path: web-build.zip

  export-android:
    name: Export Android
    needs: [test]
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Provision Android Keystore Fallback
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.GODOT_ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystores
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > keystores/release.keystore
          elif [ ! -f keystores/release.keystore ]; then
            keytool -genkeypair -v -keystore keystores/release.keystore -storepass android -alias genericreleasekey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=IdleArcade, OU=Development, O=IdleArcade, L=Berlin, ST=Berlin, C=DE"
          fi

      - name: Relocate Godot Export Templates & Config
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          if [ "$HOME" != "/root" ]; then
            cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/ || true
            mkdir -v -p ~/.config/godot
            cp -r /root/.config/godot/* ~/.config/godot/ || true
          fi

      - name: Build Android APK Export
        run: |
          mkdir -v -p build/android
          godot --headless --export-release "Android" build/android/IdleArcade.apk
          cp build/android/IdleArcade.apk ./IdleArcade.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: IdleArcade.apk

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [export-web, export-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Web Directory Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web

      - name: Download Web ZIP Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build-zip
          path: dist

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist

      - name: Publish Automated Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            dist/IdleArcade.apk
            dist/web-build.zip

      - name: Deploy Web Export to release branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: release
          publish_dir: ./build/web
          commit_message: "Deploy web build ${{ github.ref_name }}"
